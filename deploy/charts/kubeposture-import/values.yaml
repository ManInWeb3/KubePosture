#     type: object
#     additionalProperties: {type: string}
# @schema.root

# @schema
# type: string
# minLength: 1
# required: true
# @schema
# -- Cluster name as registered in KubePosture (e.g. cluster-name-1, cluster-name-2). Required.
clusterName: ""

# @schema
# type: string
# pattern: '^https?://'
# required: true
# @schema
# -- KubePosture API base URL
kubepostureUrl: "https://kubeposture.central.someorg.xyz"

# -- KubePosture API token — provide either a plaintext value or a secret reference.
# If secretRef.name is set it takes precedence over value.
token:
  value: "SomeStrongSecret"               # plaintext value (default)
  # @schema
  # type: object
  # additionalProperties: false
  # properties:
  #   name: {type: [string, "null"]}
  #   key: {type: [string, "null"]}
  # @schema
  secretRef:
    name: null                            # if set, takes precedence over value
    key: null

# -- What to import
import:
  trivy: true
  kyverno: true

# -- Run the import once on install/upgrade, then follow the schedule.
# Set to false to only run on the schedule.
initialRun: true

# @schema
# $ref: "#/definitions/cronSchedule"
# @schema
# -- CronJob schedule (default: every 6 hours)
schedule: "0 */6 * * *"

# @schema
# type: integer
# minimum: 1
# @schema
# -- Maximum run time for the import job. A cycle is ~10 requests and
# normally finishes in seconds. Must stay <= the central's
# IMPORT_LOCK_TIMEOUT_SECONDS (1200) so a slow-but-alive import is never
# raced by a second one.
activeDeadlineSeconds: 900

# @schema
# type: integer
# minimum: 1
# @schema
# -- Wall-clock budget for uploads + commit inside one run. Past it the
# importer stops retrying and aborts the import server-side, so a clean
# abort always lands before Kubernetes SIGKILLs the pod at
# activeDeadlineSeconds. Must be < activeDeadlineSeconds.
uploadDeadlineSeconds: 600

# -- Relevance filter: drop scan reports for images that are not
# currently running (Trivy keeps a report for every historical
# ReplicaSet) and for workloads no longer in the snapshot. The central
# would skip or hide those anyway; shipping them is pure cost. Set to
# false as an escape hatch while investigating a digest mismatch
# (coverage ratio unexpectedly low) — no central change needed.
relevanceFilter: true

# -- Scan-coverage check (record + alert, never aborts the import): the
# ratio (matched / expected) below which the importer prints a WARNING
# and the central logs `import.coverage_low`. Kyverno coverage is always
# informational.
coverage:
  # @schema
  # type: number
  # minimum: 0
  # maximum: 1
  # @schema
  minRatio: 0.9

# @schema
# type: string
# enum: [info, debug]
# @schema
# -- Importer log verbosity: info | debug (debug lists unmatched digests
# and every deployed digest with its source — useful once, noisy always).
logLevel: info

# -- Scratch space for building the bundles (one uncompressed pass of
# the snapshot, ~20 MB for a mid-size cluster, then the gzipped
# bundles). Mounted at /tmp (readOnlyRootFilesystem is on).
tmp:
  # @schema
  # $ref: "#/definitions/quantity"
  # @schema
  sizeLimit: 256Mi

# -- When an import run succeeds, delete previously failed Jobs owned by
# the same CronJob (main or trigger, whichever just succeeded). Transient
# failures (connection resets, etc.) that later resolve on their own would
# otherwise sit in the Job history and keep tripping failed-job alerts.
# failedJobsHistoryLimit still applies as a cap for the case where cleanup
# itself can't run (flag disabled, or the delete fails).
cleanupFailedJobsOnSuccess: true

# @schema
# type: integer
# minimum: 1
# @schema
# -- Per-request HTTP timeout (seconds) for calls to the KubePosture API.
# A bundle upload is one request; bump this if uploads of SBOM-heavy
# clusters time out through a slow LB/ingress.
httpTimeoutSeconds: 60

# @schema
# $ref: "#/definitions/stringMap"
# @schema
# -- Extra annotations on the install/upgrade Job (NOT the CronJob).
# The Job is rendered as a regular resource (no helm.sh/hook), so under
# plain Helm or ArgoCD it's only created/replaced when its spec changes.
# Under ArgoCD, uncomment the entry below: hooks would otherwise rerun
# on every sync and gate sync completion. Force=true,Replace=true is
# needed because Jobs are immutable — without it, ArgoCD can't update
# the Job spec on chart upgrades (e.g. new image tag).
jobAnnotations: {}
  # argocd.argoproj.io/sync-options: Force=true,Replace=true

# -- On-demand reimport trigger (pull pattern).
# A second CronJob ticks every minute and only runs the full import when
# an admin has clicked "Re-import" in KubePosture. Most ticks just hit
# /api/v1/imports/pending/ and exit immediately. Disable to fall back to
# the 6-hour cadence above.
trigger:
  enabled: true
  # @schema
  # $ref: "#/definitions/cronSchedule"
  # @schema
  schedule: "* * * * *"
  # @schema
  # type: integer
  # minimum: 1
  # @schema
  # -- Same deadline as the main job: idle ticks complete in seconds, but
  # when a real import fires it runs the same code path and needs the
  # same budget.
  activeDeadlineSeconds: 900

# -- Image containing the import script + kubernetes Python client
image:
  # @schema
  # type: string
  # minLength: 1
  # @schema
  repository: ghcr.io/maninweb3/kubeposture   # same image as the main app
  # @schema
  # type: string
  # enum: [Always, IfNotPresent, Never]
  # @schema
  pullPolicy: IfNotPresent
  tag: ""                                     # empty = use Chart.yaml appVersion

# @schema
# type: array
# items:
#   type: object
#   additionalProperties: false
#   required: [name]
#   properties:
#     name: {type: string, minLength: 1}
# @schema
# -- Pull secrets, as `- name: <secret>` entries.
imagePullSecrets: []

# @schema
# $ref: "#/definitions/resources"
# @schema
# -- Resources for the import job. The kubernetes client's typed objects
# for a full cluster listing dominate RSS; the bundle path itself streams
# and adds no large in-memory copies.
resources:
  requests:
    cpu: 1
    memory: 256Mi
  limits:
    cpu: 2
    memory: 512Mi

# -- Override the chart name used in resource names.
nameOverride: ""
# -- Override the full release-qualified resource name.
fullnameOverride: ""

# -- Service account: needs read access to Trivy and Kyverno CRDs
serviceAccount:
  create: true
  automount: true
  # @schema
  # $ref: "#/definitions/stringMap"
  # @schema
  annotations: {}
  name: ""

# @schema
# $ref: "#/definitions/stringMap"
# @schema
# -- Node selector for the import pods.
nodeSelector: {}
# @schema
# type: array
# items:
#   type: object
#   additionalProperties: true
# @schema
# -- Tolerations for the import pods (passed through verbatim).
tolerations: []
