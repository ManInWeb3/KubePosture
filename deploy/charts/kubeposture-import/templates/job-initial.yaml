{{/*
Run the import once on install/upgrade so findings appear immediately,
instead of waiting for the first scheduled tick. Shares the same pod spec
as the CronJob. Set initialRun: false in values to skip.

Not a Helm hook by design: under ArgoCD, hooks rerun on every sync and
gate sync completion. As a regular resource with a stable name the Job
is created once on install and only recreated when its spec changes.
Set jobAnnotations in values.yaml to add ArgoCD-specific behavior — see
the comment there.
*/}}
{{- if ne .Values.initialRun false }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubeposture-import.fullname" . }}-init
  labels:
    {{- include "kubeposture-import.labels" . | nindent 4 }}
    app.kubernetes.io/component: import-initial
  {{- with .Values.jobAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "kubeposture-import.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: import-initial
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubeposture-import.serviceAccountName" . }}
      securityContext:
        {{- include "kubeposture-import.podSecurityContext" . | nindent 8 }}
      restartPolicy: Never
      containers:
        - name: import
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # See cronjob.yaml for why import.trivy / import.kyverno are
          # not passed as flags. No failed-Job cleanup here: this Job is
          # not owned by a CronJob.
          command:
            - python
            - scripts/import-cluster.py
            - {{ required "clusterName is required" .Values.clusterName }}
            - --in-cluster
          env:
            {{- include "kubeposture-import.containerEnv" (dict "root" $ "cronjobName" "") | nindent 12 }}
          securityContext:
            {{- include "kubeposture-import.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- include "kubeposture-import.tmpVolume" . | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
