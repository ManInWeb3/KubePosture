{{/*
Run the import once on install/upgrade so findings appear immediately,
instead of waiting for the first scheduled tick. Shares the same pod spec
as the CronJob. Set initialRun: false in values to skip.

Not a Helm hook by design: under ArgoCD, hooks rerun on every sync and
gate sync completion. As a regular resource with a stable name the Job
is created once on install and only recreated when its spec changes.
Set jobAnnotations in values.yaml to add ArgoCD-specific behavior — see
the comment there.
*/}}
{{- if ne .Values.initialRun false }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kubeposture-import.fullname" . }}-init
  labels:
    {{- include "kubeposture-import.labels" . | nindent 4 }}
    app.kubernetes.io/component: import-initial
  {{- with .Values.jobAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "kubeposture-import.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: import-initial
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "kubeposture-import.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      restartPolicy: Never
      containers:
        - name: import
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Token comes from KUBEPOSTURE_TOKEN env var (not positional arg)
          # to keep it out of `ps` and `kubectl describe pod`.
          # See cronjob.yaml for why import.trivy / import.kyverno are
          # not passed as flags.
          command:
            - python
            - scripts/import-cluster.py
            - {{ required "clusterName is required" .Values.clusterName }}
            - --in-cluster
          env:
            - name: KUBEPOSTURE_URL
              value: {{ .Values.kubepostureUrl | quote }}
            - name: KUBEPOSTURE_TOKEN
            {{- if .Values.token.secretRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.token.secretRef.name }}
                  key: {{ .Values.token.secretRef.key }}
            {{- else }}
              value: {{ .Values.token.value | quote }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
