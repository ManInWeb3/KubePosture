apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kubeposture-import.fullname" . }}
  labels:
    {{- include "kubeposture-import.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "kubeposture-import.selectorLabels" . | nindent 12 }}
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "kubeposture-import.serviceAccountName" . }}
          securityContext:
            {{- include "kubeposture-import.podSecurityContext" . | nindent 12 }}
          restartPolicy: Never
          containers:
            - name: import
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              # The script lists every supported CRD; a CRD that is not
              # installed (e.g. Trivy absent) is simply left out of the
              # import. The `import.trivy` / `import.kyverno` toggles in
              # values.yaml only narrow the ClusterRole, not the script
              # invocation.
              command:
                - python
                - scripts/import-cluster.py
                - {{ required "clusterName is required" .Values.clusterName }}
                - --in-cluster
              env:
                {{- include "kubeposture-import.containerEnv" (dict "root" $ "cronjobName" (include "kubeposture-import.fullname" .)) | nindent 16 }}
              securityContext:
                {{- include "kubeposture-import.containerSecurityContext" . | nindent 16 }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            {{- include "kubeposture-import.tmpVolume" . | nindent 12 }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
