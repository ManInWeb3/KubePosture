# -- KubePosture Helm chart values
# Database is NOT included — use CNPG (CloudNativePG) or any external PostgreSQL 16+.

# -- Django SECRET_KEY — provide either a plaintext value or a secret reference.
# If secretRef is set it takes precedence over value.
secretKey:
  value: "SomeStrongSecret"    # plaintext (not recommended for production)
  secretRef:
    name: null       # K8s secret name
    key: null                # key inside that secret

# -- Database URL secret (e.g. CNPG-generated secret)
db:
  secretName: kubeposture-secret   # secret that holds the DB URL
  urlKey: DATABASE_URL             # key inside that secret (e.g. "uri" for CNPG)

# -- Application environment variables (non-sensitive)
app:
  env:
    DEBUG: "False"
    ALLOWED_HOSTS: "*"
    CSRF_TRUSTED_ORIGINS: ""      # e.g. "https://kubeposture.example.com"
    LOG_LEVEL: "INFO"
    INGEST_QUEUE_MAX_ATTEMPTS: "3"
    INTERNAL_INGRESS_CLASSES: ""  # CSV of ingress class names treated as not public, e.g. "pomerium,nginx-internal"

# Compliance framework loading is not implemented in this milestone.
# The fixtures/ directory holds sample YAMLs but no `load_frameworks`
# command exists yet; the setup job will only seed RBAC + the default
# admin user.

# ── Web Deployment ──────────────────────────────────────────────

web:
  replicaCount: 2
  command:
    - gunicorn
    - kubeposture.wsgi:application
    - --bind
    - 0.0.0.0:8000
    - --workers
    - "2"
    - --access-logfile
    - "-"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Liveness uses /healthz (process up); readiness uses /readyz (DB reachable).
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80

# ── Queue Worker CronJob ────────────────────────────────────────

worker:
  enabled: true
  schedule: "*/3 * * * *"       # every 3 minutes
  concurrencyPolicy: Allow      # allow overlap during heavy imports
  parallelism: 1                # pods per job (increase for burst processing)
  activeDeadlineSeconds: 300
  # Default mode loops drain_once batches until the queue is empty,
  # then exits. --limit caps the number of items fetched per inner batch.
  command:
    - python
    - manage.py
    - process_ingest_queue
    - --limit
    - "100"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Init: DB migrations ────────────────────────────────────────

migration:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── CronJobs ───────────────────────────────────────────────────

# Crons with initialRun: true also run once as a post-install/upgrade Job —
# used for seeding EPSS/KEV data immediately instead of waiting for the next tick.
# Crons without initialRun only run on their schedule.
cronJobs:
  # CISA KEV catalog — small (~1.5k rows), refreshed daily by CISA.
  enrichKev:
    enabled: true
    initialRun: true            # seed KEV on install
    schedule: "15 3 * * *"      # daily 03:15 UTC
    command: ["python", "manage.py", "enrich_fetch", "--source", "kev"]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    activeDeadlineSeconds: 300

  # first.org EPSS feed — ~330k rows, published daily.
  enrichEpss:
    enabled: true
    initialRun: true            # seed EPSS on install
    schedule: "30 3 * * *"      # daily 03:30 UTC (after KEV)
    command: ["python", "manage.py", "enrich_fetch", "--source", "epss"]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    activeDeadlineSeconds: 600

  # Safety-net for import-level auto-resolve. The queue processor reaps
  # inline after each item transitions to DONE (zero-latency); this
  # CronJob covers the case where the processor restarts or misses a
  # signal, so a stranded ImportMark doesn't leak findings indefinitely.
  reapSafetyNet:
    enabled: true
    schedule: "7 * * * *"       # hourly at :07 to stagger from other crons
    command: ["python", "manage.py", "reap_safety_net"]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
    activeDeadlineSeconds: 300

  # Daily Snapshot heartbeat for the CVE-trend charts. Scheduled after
  # the enrichment runs have settled so the captured counts reflect
  # end-of-day state, not mid-import churn.
  snapshotCapture:
    enabled: true
    schedule: "30 6 * * *"      # daily 06:30 UTC (after reaper + enrichment)
    command: ["python", "manage.py", "snapshot_capture"]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 256Mi
    activeDeadlineSeconds: 300

  # Delete Snapshot rows older than SNAPSHOT_RETENTION_DAYS (default 365).
  pruneSnapshots:
    enabled: true
    schedule: "0 7 * * *"       # daily 07:00 UTC (after snapshot_capture)
    command: ["python", "manage.py", "prune_snapshots"]
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    activeDeadlineSeconds: 300

  # Recompute every Finding's effective_priority. Cheap when the urgency
  # tree hasn't changed; expensive enough that we run it weekly rather
  # than nightly.
  recalculatePriorities:
    enabled: true
    schedule: "0 6 * * 0"       # weekly Sunday 06:00 UTC
    command: ["python", "manage.py", "recalculate_priorities"]
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    activeDeadlineSeconds: 1800

# ── Default admin user (created on first install, skipped if exists) ─

adminUser:
  username: admin
  password: admin
  email: admin@kubeposture.local

# ── Post-install/upgrade Job ───────────────────────────────────

setupJob:
  # Runs: migrate, setup_rbac, createsuperuser (all idempotent — the
  # superuser step uses `|| true` so a re-run after the user exists is
  # a no-op).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Image ──────────────────────────────────────────────────────

image:
  repository: ghcr.io/maninweb3/kubeposture
  pullPolicy: IfNotPresent
  tag: ""                 # empty = use Chart.yaml appVersion

imagePullSecrets: []

# ── Naming ─────────────────────────────────────────────────────

nameOverride: ""
fullnameOverride: ""

# ── Service Account ────────────────────────────────────────────

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# ── Service ────────────────────────────────────────────────────

service:
  type: ClusterIP
  port: 8000

# ── Ingress ────────────────────────────────────────────────────

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kubeposture.central.someorg.xyz
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ── Pod config ─────────────────────────────────────────────────

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
