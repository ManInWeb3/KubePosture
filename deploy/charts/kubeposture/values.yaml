# ── Ingress ────────────────────────────────────────────────────

# -- Ingress for the web Service.
ingress:
  enabled: false
  className: ""
  # @schema
  # $ref: "#/definitions/stringMap"
  # @schema
  # -- The importer uploads one gzip bundle per kind per cycle (~2 MB today;
  # SBOM-heavy clusters larger). ingress-nginx's default body limit is
  # 1m, so raise it, and give a slow upload room:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  #   nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
  #   nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
  annotations: {}
  # @schema
  # type: array
  # items:
  #   type: object
  #   additionalProperties: false
  #   required: [host, paths]
  #   properties:
  #     host: {type: string, minLength: 1}
  #     paths:
  #       type: array
  #       minItems: 1
  #       items:
  #         type: object
  #         additionalProperties: false
  #         required: [path, pathType]
  #         properties:
  #           path: {type: string, minLength: 1}
  #           pathType: {type: string, enum: [Prefix, Exact, ImplementationSpecific]}
  # @schema
  hosts:
    - host: kubeposture.central.someorg.xyz
      paths:
        - path: /
          pathType: Prefix
  # @schema
  # type: array
  # items:
  #   type: object
  #   additionalProperties: false
  #   properties:
  #     secretName: {type: string, minLength: 1}
  #     hosts: {type: array, items: {type: string, minLength: 1}}
  # @schema
  tls: []

# ── Monitoring ─────────────────────────────────────────────────

# -- /metrics is always exposed. Setting `enabled: true` renders a
# ServiceMonitor for the Prometheus Operator (gated on the CRD being
# present in the cluster — bare clusters without the operator install
# fine with the flag set, the template just renders empty).
monitoring:
  enabled: false
  serviceMonitor:
    # @schema
    # type: string
    # pattern: '^[0-9]+(ms|s|m|h)$'
    # @schema
    interval: 30s
    # @schema
    # type: string
    # pattern: '^[0-9]+(ms|s|m|h)$'
    # @schema
    scrapeTimeout: 10s
    # @schema
    # $ref: "#/definitions/stringMap"
    # @schema
    labels: {}                  # extra labels for Prometheus selector matching, e.g. release: kube-prometheus

# ── Pod config ─────────────────────────────────────────────────

# @schema
# $ref: "#/definitions/stringMap"
# @schema
# -- Extra annotations on every pod.
podAnnotations: {}
# @schema
# $ref: "#/definitions/stringMap"
# @schema
# -- Extra labels on every pod.
podLabels: {}

# -- Scratch space (/tmp) for every pod: bundle spooling on the web pods,
# downloaded feeds in the enrichment jobs. Disk-backed emptyDir; the
# limit evicts a runaway pod instead of filling the node's disk.
tmp:
  # @schema
  # $ref: "#/definitions/quantity"
  # @schema
  sizeLimit: 1Gi

# @schema
# $ref: "#/definitions/stringMap"
# @schema
# -- Node selector for every pod.
nodeSelector: {}
# @schema
# type: array
# items:
#   type: object
#   additionalProperties: true
# @schema
# -- Tolerations for every pod (passed through verbatim).
tolerations: []
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Affinity for the web Deployment (passed through verbatim).
affinity: {}
