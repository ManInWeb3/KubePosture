# -- KubePosture Helm chart values
# Database is NOT included — use CNPG (CloudNativePG) or any external PostgreSQL 16+.

# -- Django SECRET_KEY — provide either a plaintext value or a secret reference.
# If secretRef is set it takes precedence over value.
secretKey:
  value: "SomeStrongSecret"    # plaintext (not recommended for production)
  secretRef:
    name: null       # K8s secret name
    key: null                # key inside that secret

# -- Database URL secret (e.g. CNPG-generated secret)
db:
  secretName: kubeposture-secret   # secret that holds the DB URL
  urlKey: DATABASE_URL             # key inside that secret (e.g. "uri" for CNPG)

# -- Application environment variables (non-sensitive)
app:
  env:
    DEBUG: "False"
    ALLOWED_HOSTS: "*"
    CSRF_TRUSTED_ORIGINS: ""      # e.g. "https://kubeposture.example.com"
    LOG_LEVEL: "INFO"
    INGEST_QUEUE_MAX_ATTEMPTS: "3"
    INTERNAL_INGRESS_CLASSES: ""  # CSV of ingress class names treated as not public, e.g. "pomerium,nginx-internal"
    # -- Proxy-forwarded JWT auth. When JWT_AUTH_ENABLED="true", requests
    # carrying a valid JWT in JWT_AUTH_HEADER auto-create a Django User in
    # the `viewer` group and start a session. Importer paths bypass this.
    # Defaults shaped for Pomerium; adjust header/JWKS for oauth2-proxy /
    # Cloudflare Access / Authelia. See docs/auth-jwt-proxy.md.
    # JWT_AUTH_ENABLED: "true"
    # JWT_AUTH_HEADER: "X-Pomerium-Jwt-Assertion"
    # JWT_AUTH_JWKS_URL: "https://authenticate.pomerium.someorg.xyz/.well-known/pomerium/jwks.json"
    # JWT_AUTH_AUDIENCE: "kubeposture.someorg.xyz"
    # JWT_AUTH_ISSUER: "authenticate.pomerium.someorg.xyz"
    PROMETHEUS_MULTIPROC_DIR: "/tmp/prom_multiproc"
    METRICS_BUSINESS_TTL_SECONDS: "300"   # business gauges cached this long; finding counts only change when imports complete
    # TTL for the in-flight-import "lock". An open/draining ImportMark
    # older than this is treated as abandoned (crashed importer) and
    # stops blocking new on-demand imports. Lower if a crashed importer
    # leaves the in-cluster trigger skipping for too long; raise if
    # legitimate slow imports get raced. Defaults to 30min, matching
    # the workload-cluster job's activeDeadlineSeconds (900s) with 2x
    # headroom for slow networks.
    IMPORT_LOCK_TIMEOUT_SECONDS: "900"
    # Aikido Intel feed URL — public JSON feed of malicious-publish IoCs.
    # Override here if Aikido moves the endpoint; set to "" to disable
    # the aikido fetcher entirely.
    # AIKIDO_INTEL_URL: "https://intel.aikido.dev/api/?format=json"

# Compliance framework loading is not implemented in this milestone.
# The fixtures/ directory holds sample YAMLs but no `load_frameworks`
# command exists yet; the setup job will only seed RBAC + the default
# admin user.

# ── Web Deployment ──────────────────────────────────────────────

web:
  replicaCount: 2
  command:
    - gunicorn
    - -c
    - gunicorn.conf.py
    - kubeposture.wsgi:application
    - --bind
    - 0.0.0.0:8000
    - --workers
    - "2"
    - --access-logfile
    - "-"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # Liveness uses /healthz (process up); readiness uses /readyz (DB reachable).
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 80

# ── Queue Worker CronJob ────────────────────────────────────────

worker:
  enabled: true
  schedule: "*/3 * * * *"       # every 3 minutes
  concurrencyPolicy: Allow      # allow overlap during heavy imports
  parallelism: 1                # pods per job (increase for burst processing)
  activeDeadlineSeconds: 300
  # Default mode loops drain_once batches until the queue is empty,
  # then exits. --limit caps the number of items fetched per inner batch.
  command:
    - python
    - manage.py
    - process_ingest_queue
    - --limit
    - "100"
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

# ── Init: DB migrations ────────────────────────────────────────

migration:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── CronJobs ───────────────────────────────────────────────────

# Crons with initialRun: true also run once as a post-install/upgrade Job —
# used for seeding EPSS/KEV data immediately instead of waiting for the next tick.
# Crons without initialRun only run on their schedule.
cronJobs:
  # CISA KEV catalog — small (~1.5k rows), refreshed daily by CISA.
  enrichKev:
    enabled: true
    initialRun: true            # seed KEV on install
    schedule: "15 3 * * *"      # daily 03:15 UTC
    command: ["python", "manage.py", "enrich_fetch", "--source", "kev"]
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
    activeDeadlineSeconds: 300

  # first.org EPSS feed — ~330k rows, published daily.
  enrichEpss:
    enabled: true
    initialRun: true            # seed EPSS on install
    schedule: "30 3 * * *"      # daily 03:30 UTC (after KEV)
    command: ["python", "manage.py", "enrich_fetch", "--source", "epss"]
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
    activeDeadlineSeconds: 600

  # # Aikido Intel feed — npm/PyPI malicious-publish IoCs, fast-moving.
  # # OPT-IN: Aikido retired their free public feed; the cron is a no-op
  # # unless AIKIDO_INTEL_URL is set (env / Helm values.env) to a feed
  # # you can read (private mirror, paid Aikido endpoint, or an internal
  # # proxy that adapts the new OAuth-gated API to the legacy shape).
  # # Default disabled so a fresh install doesn't run a noisy no-op
  # # every 15 min; flip `enabled: true` once you've wired a URL.
  # enrichAikido:
  #   enabled: false
  #   schedule: "*/15 * * * *"    # every 15 minutes (when enabled)
  #   command: ["python", "manage.py", "enrich_fetch", "--source", "aikido"]
  #   resources:
  #     requests:
  #       cpu: 50m
  #       memory: 128Mi
  #     limits:
  #       cpu: 300m
  #       memory: 256Mi
  #   activeDeadlineSeconds: 300

  # OSV.dev per-ecosystem bulk-zip snapshots. Conditional GET keeps
  # off-cycle ticks cheap; only ecosystems present in SbomComponent
  # are fetched. ~100MB npm zip on actual fetches, so memory is bumped.
  enrichOsvSupplyChain:
    enabled: true
    schedule: "5 * * * *"       # hourly at :05 to avoid coinciding with EPSS
    command: ["python", "manage.py", "enrich_fetch", "--source", "osv-supply-chain"]
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
    activeDeadlineSeconds: 900

  # Safety-net for import-level auto-resolve. The queue processor reaps
  # inline after each item transitions to DONE (zero-latency); this
  # CronJob covers the case where the processor restarts or misses a
  # signal, so a stranded ImportMark doesn't leak findings indefinitely.
  reapSafetyNet:
    enabled: true
    schedule: "7 * * * *"       # hourly at :07 to stagger from other crons
    command: ["python", "manage.py", "reap_safety_net"]
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
    activeDeadlineSeconds: 300

  # Daily Snapshot heartbeat for the CVE-trend charts. Scheduled after
  # the enrichment runs have settled so the captured counts reflect
  # end-of-day state, not mid-import churn.
  snapshotCapture:
    enabled: true
    schedule: "30 6 * * *"      # daily 06:30 UTC (after reaper + enrichment)
    command: ["python", "manage.py", "snapshot_capture"]
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
    activeDeadlineSeconds: 300

  # Daily DB hygiene — prune stale rows from operational tables that
  # otherwise grow unboundedly (IngestQueue, ImportMark, ScanInconsistency,
  # old Findings, SbomComponents on long-undeployed images). Retention
  # windows per target are configurable via flags; see
  # `core/services/pruning.py` for defaults and rationale.
  pruneStaleData:
    enabled: true
    schedule: "45 4 * * *"      # daily 04:45 UTC (after EPSS/KEV, before snapshot_capture)
    command: ["python", "manage.py", "prune_stale_data"]
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
    activeDeadlineSeconds: 600

  # Delete Snapshot rows older than SNAPSHOT_RETENTION_DAYS (default 365).
  pruneSnapshots:
    enabled: true
    schedule: "0 7 * * *"       # daily 07:00 UTC (after snapshot_capture)
    command: ["python", "manage.py", "prune_snapshots"]
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
    activeDeadlineSeconds: 300

  # Recompute every Finding's effective_priority. Cheap when the urgency
  # tree hasn't changed; expensive enough that we run it weekly rather
  # than nightly.
  recalculatePriorities:
    enabled: true
    schedule: "0 6 * * 0"       # weekly Sunday 06:00 UTC
    command: ["python", "manage.py", "recalculate_priorities"]
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi
    activeDeadlineSeconds: 1800

# ── Default admin user (created on first install, skipped if exists) ─

adminUser:
  username: admin
  password: admin
  email: admin@kubeposture.local

# ── Post-install/upgrade Job ───────────────────────────────────

setupJob:
  # Runs: migrate, setup_rbac, createsuperuser (all idempotent — the
  # superuser step uses `|| true` so a re-run after the user exists is
  # a no-op).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # -- Extra annotations on the setup Job.
  # The Job is rendered as a regular resource (no helm.sh/hook), so under
  # plain Helm or ArgoCD it's only created/replaced when its spec changes.
  # Under ArgoCD, uncomment the entry below: hooks would otherwise rerun
  # on every sync and gate sync completion. Force=true,Replace=true is
  # needed because Jobs are immutable — without it, ArgoCD can't update
  # the Job spec on chart upgrades (e.g. new image tag).
  annotations: {}
    # argocd.argoproj.io/sync-options: Force=true,Replace=true

# ── Image ──────────────────────────────────────────────────────

image:
  repository: ghcr.io/maninweb3/kubeposture
  pullPolicy: IfNotPresent
  tag: ""                 # empty = use Chart.yaml appVersion

imagePullSecrets: []

# ── Naming ─────────────────────────────────────────────────────

nameOverride: ""
fullnameOverride: ""

# ── Service Account ────────────────────────────────────────────

serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# ── Service ────────────────────────────────────────────────────

service:
  type: ClusterIP
  port: 8000

# ── Ingress ────────────────────────────────────────────────────

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: kubeposture.central.someorg.xyz
      paths:
        - path: /
          pathType: Prefix
  tls: []

# ── Monitoring ─────────────────────────────────────────────────
#
# /metrics is always exposed. Setting `enabled: true` renders a
# ServiceMonitor for the Prometheus Operator (gated on the CRD being
# present in the cluster — bare clusters without the operator install
# fine with the flag set, the template just renders empty).

monitoring:
  enabled: false
  serviceMonitor:
    interval: 30s
    scrapeTimeout: 10s
    labels: {}                  # extra labels for Prometheus selector matching, e.g. release: kube-prometheus

# ── Pod config ─────────────────────────────────────────────────

podAnnotations: {}
podLabels: {}

nodeSelector: {}
tolerations: []
affinity: {}
