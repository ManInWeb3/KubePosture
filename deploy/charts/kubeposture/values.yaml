#
# values.schema.json is GENERATED from this file by dadav/helm-schema —
# never edit it by hand. The `# @schema … # @schema` blocks below carry
# the constraints the generator cannot infer (enums, nullables, ranges,
# free-form maps, shared definitions); everything else (types, defaults,
# descriptions) is inferred from the values and the comments above them.
#
#   helm-schema -c deploy/charts -n -r -a        # regenerate both charts
#   helm-schema -c deploy/charts -n --check      # what CI runs
#
# Helm validates the *merged* values against the schema on install /
# upgrade / lint / template, so a typo'd key or a wrong type fails before
# anything is rendered.

# @schema.root
# title: KubePosture chart values
# description: Central KubePosture deployment — web, queue worker, batch CronJobs. The database is NOT included; use CNPG or any external PostgreSQL 16+.
# definitions:
#   quantity:
#     description: Kubernetes resource quantity, e.g. 500m, 1, 1.5, 512Mi, 2Gi.
#     type: [string, number]
#     pattern: '^[0-9]+(\.[0-9]+)?(m|k|M|G|T|P|E|Ki|Mi|Gi|Ti|Pi|Ei)?$'
#   resourceList:
#     type: object
#     additionalProperties: false
#     properties:
#       cpu: {$ref: "#/definitions/quantity"}
#       memory: {$ref: "#/definitions/quantity"}
#       ephemeral-storage: {$ref: "#/definitions/quantity"}
#   resources:
#     description: Kubernetes ResourceRequirements. Batch jobs run with requests == limits (Guaranteed QoS) — see docs/operations/batch-jobs-memory.md.
#     type: object
#     additionalProperties: false
#     properties:
#       requests: {$ref: "#/definitions/resourceList"}
#       limits: {$ref: "#/definitions/resourceList"}
#   cronSchedule:
#     description: Cron expression (5 fields) or a @-macro such as @daily.
#     type: string
#     pattern: '^(@(yearly|annually|monthly|weekly|daily|midnight|hourly)|(\S+\s+){4}\S+)$'
#   command:
#     description: Container command (argv). One string per element.
#     type: array
#     minItems: 1
#     items: {type: string}
#   stringMap:
#     description: Free-form string→string map (labels, annotations, selectors).
#     type: object
#     additionalProperties: {type: string}
#   secretRef:
#     description: Reference to a key in an existing Secret. Both fields null → the plaintext `value` is used instead.
#     type: object
#     additionalProperties: false
#     properties:
#       name: {type: [string, "null"]}
#       key: {type: [string, "null"]}
#   cronJob:
#     description: One batch CronJob. Rendered by templates/cronjobs.yaml.
#     type: object
#     additionalProperties: false
#     required: [schedule, command]
#     properties:
#       enabled: {type: boolean, default: true}
#       schedule: {$ref: "#/definitions/cronSchedule"}
#       command: {$ref: "#/definitions/command"}
#       resources: {$ref: "#/definitions/resources"}
#       activeDeadlineSeconds: {type: integer, minimum: 1, default: 300}
# @schema.root

# -- Django SECRET_KEY — provide either a plaintext value or a secret reference.
# If secretRef is set it takes precedence over value.
secretKey:
  value: "SomeStrongSecret"    # plaintext (not recommended for production)
  # @schema
  # $ref: "#/definitions/secretRef"
  # @schema
  secretRef:
    name: null       # K8s secret name
    key: null                # key inside that secret

# -- Database URL secret (e.g. CNPG-generated secret)
db:
  # @schema
  # type: string
  # minLength: 1
  # required: true
  # @schema
  secretName: kubeposture-secret   # secret that holds the DB URL
  # @schema
  # type: string
  # minLength: 1
  # required: true
  # @schema
  urlKey: DATABASE_URL             # key inside that secret (e.g. "uri" for CNPG)
  # -- CA bundle for sslmode=verify-full/verify-ca: mounted into every container
  # and exported as PGSSLROOTCERT. name null → nothing mounted.
  # @schema
  # $ref: "#/definitions/secretRef"
  # @schema
  caSecret:
    name: null       # K8s secret name
    key: ca.crt      # key inside that secret

# -- Application environment variables (non-sensitive)
app:
  # @schema
  # type: object
  # additionalProperties:
  #   type: [string, number, boolean]
  # properties: {}
  # @schema
  # -- Rendered 1:1 as container env vars (values are quoted, so numbers and
  # booleans are accepted). Any key may be added; the ones below are the
  # settings the app reads — see kubeposture/settings.py.
  env:
    DEBUG: "False"
    ALLOWED_HOSTS: "*"
    CSRF_TRUSTED_ORIGINS: ""      # e.g. "https://kubeposture.example.com"
    LOG_LEVEL: "INFO"
    INTERNAL_INGRESS_CLASSES: ""  # CSV of ingress class names treated as not public, e.g. "pomerium,nginx-internal"
    # -- Import bundles (see core/services/bundle_ingest.py). The upload
    # view streams the body itself, so these caps — not Django's
    # DATA_UPLOAD_MAX_MEMORY_SIZE — bound a bundle. A cycle is ~20 MB
    # uncompressed / ~2 MB gzipped today; defaults leave wide headroom.
    IMPORT_BUNDLE_MAX_COMPRESSED_BYTES: "67108864"      # 64 MiB
    IMPORT_BUNDLE_MAX_UNCOMPRESSED_BYTES: "134217728"   # 128 MiB — one bundle is one transaction
    IMPORT_BUNDLE_MAX_ITEMS: "50000"
    IMPORT_BUNDLE_MAX_LINE_BYTES: "33554432"            # 32 MiB — the inventory envelope is one line
    # commit logs `import.coverage_low` at ERROR when the importer-reported
    # scan coverage (matched / expected) is below this; the import proceeds.
    IMPORT_COVERAGE_ALERT_RATIO: "0.9"
    # Debugging aid only. The reap deletes a tuple's queue rows once it has
    # recorded failed_count / last_error on the ImportMark; "true" keeps
    # `failed` rows (with their raw payloads) for the 14-day prune so a
    # reproducible parse failure can be replayed. Turn on while
    # investigating, off afterwards.
    IMPORT_KEEP_FAILED_PAYLOADS: "false"
    # Plain-JSON endpoints (commit, the testing harness) still go through
    # Django's in-memory body limit.
    DATA_UPLOAD_MAX_MEMORY_SIZE: "16777216"             # 16 MiB
    # -- Proxy-forwarded JWT auth. When JWT_AUTH_ENABLED="true", requests
    # carrying a valid JWT in JWT_AUTH_HEADER auto-create a Django User in
    # the `viewer` group and start a session. Importer paths bypass this.
    # Defaults shaped for Pomerium; adjust header/JWKS for oauth2-proxy /
    # Cloudflare Access / Authelia. See docs/auth-jwt-proxy.md.
    # JWT_AUTH_ENABLED: "true"
    # JWT_AUTH_HEADER: "X-Pomerium-Jwt-Assertion"
    # JWT_AUTH_JWKS_URL: "https://authenticate.pomerium.someorg.xyz/.well-known/pomerium/jwks.json"
    # JWT_AUTH_AUDIENCE: "kubeposture.someorg.xyz"
    # JWT_AUTH_ISSUER: "authenticate.pomerium.someorg.xyz"
    PROMETHEUS_MULTIPROC_DIR: "/tmp/prom_multiproc"
    METRICS_BUSINESS_TTL_SECONDS: "300"   # business gauges cached this long; finding counts only change when imports complete
    # TTL for the in-flight-import "lock". An open/draining ImportMark
    # older than this is treated as abandoned (crashed importer) and
    # stops blocking new on-demand imports. Must be >= the importer
    # Job's activeDeadlineSeconds (900 in kubeposture-import) so a
    # slow-but-alive import is never raced by a second one, and < the
    # reaper's STUCK_OPEN_TIMEOUT_SECONDS (1800) so an abandoned import
    # stops gating new ones before it is discarded.
    IMPORT_LOCK_TIMEOUT_SECONDS: "1200"

# Compliance framework loading is not implemented; the setup job only
# seeds RBAC + the default admin user.

# ── Web Deployment ──────────────────────────────────────────────

# -- The Django web Deployment (gunicorn).
web:
  # @schema
  # type: integer
  # minimum: 0
  # @schema
  replicaCount: 2
  # @schema
  # $ref: "#/definitions/command"
  # @schema
  command:
    # gthread (not sync) — sync workers handle one socket at a time, so two
    # half-open / slow-reading connections froze the whole pod and the arbiter
    # SIGABRT'd both workers together (see kubeposture_gunicorn_worker_aborts_total).
    # gthread gives 2 × 4 = 8 concurrent slots per pod; a stalled recv() ties up
    # one thread, not the whole worker.
    - gunicorn
    - -c
    - gunicorn.conf.py
    - kubeposture.wsgi:application
    - --bind
    - 0.0.0.0:8000
    - --workers
    - "2"
    - --worker-class
    - gthread
    - --threads
    - "4"
    - --timeout
    - "60"
    - --graceful-timeout
    - "30"
    - --access-logfile
    - "-"
  # @schema
  # $ref: "#/definitions/resources"
  # @schema
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Liveness probe (passed through verbatim). /healthz = process up.
  livenessProbe:
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 15
    timeoutSeconds: 3
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Readiness probe (passed through verbatim). /readyz = DB reachable.
  readinessProbe:
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 3
  # -- HorizontalPodAutoscaler for the web Deployment.
  autoscaling:
    enabled: false
    # @schema
    # type: integer
    # minimum: 1
    # @schema
    minReplicas: 2
    # @schema
    # type: integer
    # minimum: 1
    # @schema
    maxReplicas: 6
    # @schema
    # type: integer
    # minimum: 1
    # maximum: 100
    # @schema
    targetCPUUtilizationPercentage: 80

# ── Queue Worker CronJob ────────────────────────────────────────

# -- The ingest-queue worker CronJob (process_ingest_queue).
worker:
  enabled: true
  # @schema
  # $ref: "#/definitions/cronSchedule"
  # @schema
  schedule: "*/3 * * * *"       # every 3 minutes
  # @schema
  # type: string
  # enum: [Allow, Forbid, Replace]
  # @schema
  concurrencyPolicy: Allow      # allow overlap during heavy imports
  # @schema
  # type: integer
  # minimum: 1
  # @schema
  # -- Pods per job. claim_batch's SKIP LOCKED partitions work safely across
  # them (the k8s "work queue" Job pattern — no `completions` is set, so
  # the Job just runs `parallelism` pods to completion against the shared
  # queue). Held at 1 for now — one worker at a time until the
  # non-blocking reap claim has proven itself in prod; 4 was fine
  # capacity-wise (namespace requests ~5 cores against ~315 free). Raising
  # this alone didn't fix throughput because claim_batch's abandon-sweep
  # was missing SKIP LOCKED (fixed in core/services/queue.py) — that one
  # unprotected statement, run first on every drain_once iteration, could
  # block an entire pod on a lock held by an unrelated in-flight worker.
  parallelism: 1
  # @schema
  # type: integer
  # minimum: 1
  # @schema
  # -- Raised from 300: a large cluster's inventory item plus its reap can
  # take tens of minutes; a run killed mid-reap rolled the reap back and
  # re-did it on the next tick. Must stay below queue.STALE_PROCESSING_SECONDS
  # (2100) so a still-running item is never reclaimed by another pod.
  activeDeadlineSeconds: 1800
  # @schema
  # $ref: "#/definitions/command"
  # @schema
  # -- Claim `--limit` rows, process them, claim again — until a pass
  # claims nothing. With --limit 1 the `parallelism` pods share an import
  # row by row (a larger batch lets one pod hoard rows the others could
  # be working on). The run ends when the queue is empty or everything
  # left is held by another pod, gated behind its import's inventory, or
  # not committed yet; the next tick picks those up. --max-iterations
  # caps the passes per run (0 = no cap); --max-seconds stops starting
  # new passes (and skips the final reap sweep) once that much wall time
  # is spent — keep it below activeDeadlineSeconds with headroom for one
  # slow item + its reap (1500 under 1800 here), so a run exits instead of being killed mid-reap
  # (which rolls the reap transaction back; the post-commit priority
  # recompute keeps the chunks it committed). Each item commits
  # independently (see worker._process_one), so a pod hitting
  # activeDeadlineSeconds or its memory limit keeps what it finished and
  # holds at most --limit rows, reclaimed after STALE_PROCESSING_SECONDS.
  command:
    - python
    - manage.py
    - process_ingest_queue
    - --limit
    - "1"
    - --max-iterations
    - "0"
    - --max-seconds
    - "1500"
  # @schema
  # $ref: "#/definitions/resources"
  # @schema
  # -- requests == limits (Guaranteed QoS) like the other batch jobs; size
  # from the `command.finished peak_rss_mb=` log line.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 1Gi

# ── Init: DB migrations ────────────────────────────────────────

# -- The migrate init container of the setup Job.
migration:
  # @schema
  # $ref: "#/definitions/resources"
  # @schema
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── CronJobs ───────────────────────────────────────────────────

# @schema
# type: object
# additionalProperties:
#   $ref: "#/definitions/cronJob"
# @schema
# -- Batch CronJobs, keyed by name (kebab-cased into the resource name).
# Extra entries may be added; each one follows the `cronJob` definition.
#
# Crons only run on their schedule. To run one now — e.g. to seed KEV / EPSS /
# OSV right after the first install instead of waiting for the next tick —
# start a Job from it by hand:
#   kubectl -n <ns> create job --from=cronjob/<fullname>-<kebab-cased key> <job-name>
# e.g. `--from=cronjob/kubeposture-enrich-kev seed-kev`
# (see `kubectl -n <ns> get cronjob` for the exact names).
#
# Batch jobs run with requests == limits (Guaranteed QoS): a job is then
# never evicted or OOM-killed because a *neighbour* spiked, only when it
# exceeds its own limit. Every command logs `command.finished ...
# peak_rss_mb=` on exit — size `memory` from those lines, not by guess
# (EPSS/KEV are sized already; the rest still carry their old 2Gi limit
# as the request until a few runs have been read), and keep /tmp on the
# disk-backed emptyDir (`tmp.sizeLimit`), never `medium: Memory`, so a
# runaway download evicts the pod instead of counting against its memory
# limit.
cronJobs:
  # @schema
  # $ref: "#/definitions/cronJob"
  # @schema
  # -- CISA KEV catalog — small (~1.5k rows), refreshed daily by CISA.
  enrichKev:
    enabled: true
    schedule: "15 3 * * *"      # daily 03:15 UTC
    command: ["python", "manage.py", "enrich_fetch", "--source", "kev"]
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
    activeDeadlineSeconds: 300

  # @schema
  # $ref: "#/definitions/cronJob"
  # @schema
  # -- first.org EPSS feed — ~330k rows, published daily. Streamed from the
  # HTTP response through gunzip + csv.reader into 5k-row upserts, so
  # peak memory is one chunk, not the feed.
  enrichEpss:
    enabled: true
    schedule: "30 3 * * *"      # daily 03:30 UTC (after KEV)
    command: ["python", "manage.py", "enrich_fetch", "--source", "epss"]
    resources:
      requests:
        cpu: 500m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 512Mi
    activeDeadlineSeconds: 600

  # @schema
  # $ref: "#/definitions/cronJob"
  # @schema
  # -- OSV.dev per-ecosystem bulk-zip snapshots: malicious-package IoCs
  # and vulnerability advisories (OsvAdvisory), then the vulnerability
  # matcher over every deployed SBOM component. Conditional GET keeps
  # off-cycle ticks cheap; only ecosystems present in SbomComponent are
  # fetched. The npm zip is hundreds of MB on actual fetches, but the
  # fetcher streams it to a temp file and decompresses one advisory at a
  # time, skipping entries whose `modified` is unchanged; the first run
  # upserts every advisory (npm ≈ 230k). The key keeps its pre-lane
  # name so existing value overrides still apply.
  enrichOsvSupplyChain:
    enabled: true
    schedule: "5 * * * *"       # hourly at :05 to avoid coinciding with EPSS
    command: ["python", "manage.py", "enrich_fetch", "--source", "osv"]
    resources:
      requests:
        cpu: 1
        memory: 2Gi
      limits:
        cpu: 1
        memory: 2Gi
    activeDeadlineSeconds: 900

  # @schema
  # $ref: "#/definitions/cronJob"
  # @schema
  # -- Safety-net for import-level auto-resolve, covering both ends of the
  # ImportMark lifecycle. The queue processor reaps inline after each
  # item transitions to DONE (zero-latency); this CronJob covers the
  # case where the processor restarts or misses a signal, so a stranded
  # `draining` mark doesn't leak findings indefinitely. It also discards
  # imports that can never complete: marks abandoned in `state=open`
  # (importer died before /imports/<id>/commit/) and imports whose
  # inventory payload failed. Discarding deletes the import's queue
  # rows and marks its ImportMarks reaped with a `discard_reason` —
  # nothing partial is ever processed.
  reapSafetyNet:
    enabled: true
    schedule: "7 * * * *"       # hourly at :07 to stagger from other crons
    command: ["python", "manage.py", "reap_safety_net"]
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 500m
        memory: 2Gi
    activeDeadlineSeconds: 300

  # @schema
  # $ref: "#/definitions/cronJob"
  # @schema
  # -- Daily Snapshot heartbeat for the CVE-trend charts. Scheduled after
  # the enrichment runs have settled so the captured counts reflect
  # end-of-day state, not mid-import churn.
  snapshotCapture:
    enabled: true
    schedule: "30 6 * * *"      # daily 06:30 UTC (after reaper + enrichment)
    command: ["python", "manage.py", "snapshot_capture"]
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 500m
        memory: 2Gi
    activeDeadlineSeconds: 300

  # @schema
  # $ref: "#/definitions/cronJob"
  # @schema
  # -- Daily DB hygiene — prune stale rows from operational tables that
  # otherwise grow unboundedly (IngestQueue, ImportMark, ScanInconsistency,
  # old Findings, SbomComponents on long-undeployed images). Retention
  # windows per target are configurable via flags; see
  # `core/services/pruning.py` for defaults and rationale.
  pruneStaleData:
    enabled: true
    schedule: "45 4 * * *"      # daily 04:45 UTC (after EPSS/KEV, before snapshot_capture)
    command: ["python", "manage.py", "prune_stale_data"]
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 500m
        memory: 2Gi
    activeDeadlineSeconds: 600

  # @schema
  # $ref: "#/definitions/cronJob"
  # @schema
  # -- Delete Snapshot rows older than SNAPSHOT_RETENTION_DAYS (default 365).
  pruneSnapshots:
    enabled: true
    schedule: "0 7 * * *"       # daily 07:00 UTC (after snapshot_capture)
    command: ["python", "manage.py", "prune_snapshots"]
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 500m
        memory: 2Gi
    activeDeadlineSeconds: 300

  # @schema
  # $ref: "#/definitions/cronJob"
  # @schema
  # -- Recompute every Finding's effective_priority. Cheap when the urgency
  # tree hasn't changed; expensive enough that we run it weekly rather
  # than nightly.
  recalculatePriorities:
    enabled: true
    schedule: "0 6 * * 0"       # weekly Sunday 06:00 UTC
    command: ["python", "manage.py", "recalculate_priorities"]
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 500m
        memory: 2Gi
    activeDeadlineSeconds: 1800

# ── Default admin user (created on first install, skipped if exists) ─

# -- Default admin user (created on first install, skipped if it exists).
adminUser:
  # @schema
  # type: string
  # minLength: 1
  # @schema
  username: admin
  password: admin
  email: admin@kubeposture.local

# ── Post-install/upgrade Job ───────────────────────────────────

# -- Post-install/upgrade setup Job: migrate, setup_rbac, createsuperuser
# (all idempotent — the superuser step uses `|| true` so a re-run after
# the user exists is a no-op).
setupJob:
  # @schema
  # $ref: "#/definitions/resources"
  # @schema
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # @schema
  # $ref: "#/definitions/stringMap"
  # @schema
  # -- Extra annotations on the setup Job.
  # The Job is rendered as a regular resource (no helm.sh/hook), so under
  # plain Helm or ArgoCD it's only created/replaced when its spec changes.
  # Under ArgoCD, uncomment the entry below: hooks would otherwise rerun
  # on every sync and gate sync completion. Force=true,Replace=true is
  # needed because Jobs are immutable — without it, ArgoCD can't update
  # the Job spec on chart upgrades (e.g. new image tag).
  annotations: {}
    # argocd.argoproj.io/sync-options: Force=true,Replace=true

