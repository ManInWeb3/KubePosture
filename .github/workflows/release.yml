name: Release

# Publishes, in lockstep, everything the Helm chart consumers pull:
#   image: ghcr.io/<owner>/<repo>:<version>  (+ :<major>.<minor>, :sha-<short>, :latest)
#   chart: oci://ghcr.io/<owner-lc>/<repo-lc>/charts/kubeposture          --version <version>
#   chart: oci://ghcr.io/<owner-lc>/<repo-lc>/charts/kubeposture-import  --version <version>
# <owner>/<repo> above is lowercased for the OCI/registry paths per GHCR's
# requirement that repository paths be lowercase (github.repository for
# this repo is "ManInWeb3/KubePosture", mixed case).
#
# Trigger: every push to main. The release version is COMPUTED, not
# supplied:
#   - Normally: highest existing vX.Y.Z tag reachable from history, PATCH+1 —
#     but only if something release-relevant changed since that tag (see the
#     `plan` job below); otherwise this run is skipped entirely.
#   - Bootstrap (no vX.Y.Z tag exists anywhere yet): v0.1.0. Not expected to
#     fire today (v0.1.0..v0.6.12 already exist) — kept for robustness.
#   - Manual override: if a human pre-creates AND pushes an annotated vX.Y.Z
#     tag on some commit, and that exact commit later becomes HEAD of main,
#     this run reuses that version instead of auto-bumping.
#
# Chart version + appVersion are set from the computed version at package
# time only (each chart's on-disk Chart.yaml `version: 0.0.0` /
# `appVersion: "..."` are intentionally never touched by this workflow).
#
# On success, a single vX.Y.Z tag is pushed as an audit trail (image + both
# charts all share this one version). This replaces the three tag families
# the old docker.yml/helm.yml workflows used to trigger on (v*,
# helm-kubeposture-v*, helm-kubeposture-import-v*) — those triggers no
# longer exist, so going forward only the bare vX.Y.Z family is minted.
# Historical helm-* tags are left in place, just no new ones are created.
#
# No external registry, no GitHub Environments, no OIDC: GHCR + GITHUB_TOKEN
# is sufficient (packages: write covers both the container image and the
# OCI Helm chart artifacts, since both land in GHCR's package registry).

on:
  push:
    branches:
      - main

permissions: {}

# Serializes releases on main so two fast-successive merges can't race on
# the computed version number. Not cancel-in-progress — an in-flight
# publish must never be aborted mid-way, leaving a half-published state.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Compute version and decide whether to release
    runs-on: ubuntu-latest
    permissions:
      contents: read # read-only: no registry access needed to plan
    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # full history — version computation scans all tags
          fetch-tags: true # actions/checkout does not fetch tags by default

      - name: Compute release version and release/skip decision
        id: version
        run: |
          set -euo pipefail

          # Manual override: a human-pre-created tag already pointing at
          # HEAD wins over auto-bump (see header comment). The `|| true`
          # matters: grep exits 1 on no-match, which set -o pipefail would
          # otherwise treat as this whole line failing.
          EXISTING_TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          LAST_TAG=$(git tag -l 'v*.*.*' | sort -V | tail -1)

          if [ -n "$EXISTING_TAG" ]; then
            NEW_TAG="$EXISTING_TAG"
            SHOULD_RELEASE=true
          elif [ -z "$LAST_TAG" ]; then
            # Bootstrap: no release has ever been published.
            NEW_TAG="v0.1.0"
            SHOULD_RELEASE=true
          else
            PATCH="${LAST_TAG##*.}"
            NEW_TAG="${LAST_TAG%.*}.$((PATCH + 1))"
            # Skip if nothing release-relevant changed since the last
            # release. Diffing against LAST_TAG (a real, named commit)
            # rather than HEAD^ avoids depending on push-event commit
            # topology — a single push can land multiple commits.
            if git diff --name-only "$LAST_TAG" HEAD | grep -qE '^(Dockerfile|requirements\.txt|manage\.py|gunicorn\.conf\.py|core/|kubeposture/|templates/|static/|scripts/|deploy/charts/kubeposture/|deploy/charts/kubeposture-import/)'; then
              SHOULD_RELEASE=true
            else
              SHOULD_RELEASE=false
            fi
          fi

          echo "Computed ${NEW_TAG}, should_release=${SHOULD_RELEASE}"
          echo "tag=${NEW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${NEW_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish image + both charts
    needs: plan
    if: needs.plan.outputs.should_release == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write # only to push the vX.Y.Z audit-trail tag
      packages: write # publish image + OCI charts to ghcr.io

    steps:
      - name: Clone the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Compute release metadata (lowercase repo path, short sha, minor stream)
        id: meta
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          # GHCR requires lowercase repository paths; github.repository for
          # this repo is "ManInWeb3/KubePosture" (mixed case).
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(git rev-parse --short HEAD)
          MAJOR_MINOR="${VERSION%.*}"
          echo "repo_lc=${REPO_LC}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR_MINOR}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and push image (amd64 + arm64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.repo_lc }}:${{ needs.plan.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}:${{ steps.meta.outputs.major_minor }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}:sha-${{ steps.meta.outputs.short_sha }}
            ghcr.io/${{ steps.meta.outputs.repo_lc }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Lint, package, and push both Helm charts
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          REPO_LC: ${{ steps.meta.outputs.repo_lc }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/helm-packages
          for chart in kubeposture kubeposture-import; do
            echo "==> ${chart}"
            helm lint "deploy/charts/${chart}"
            helm package "deploy/charts/${chart}" \
              --version     "${VERSION}" \
              --app-version "${VERSION}" \
              --destination /tmp/helm-packages
            # Helm's OCI client reuses the ~/.docker/config.json credentials
            # docker/login-action already wrote above — no separate
            # `helm registry login` step needed.
            helm push \
              "/tmp/helm-packages/${chart}-${VERSION}.tgz" \
              "oci://ghcr.io/${REPO_LC}/charts"
          done

      - name: Tag the release commit
        # Only reached after the image + both charts published successfully
        # (set -euo pipefail above already aborted the job otherwise).
        # Skips cleanly if the tag already exists (the manual-override case
        # — a human already created and pushed it).
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEW_TAG: ${{ needs.plan.outputs.tag }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${NEW_TAG}" >/dev/null; then
            echo "Tag ${NEW_TAG} already exists (manual override) — not re-pushing."
            exit 0
          fi
          git tag -a "${NEW_TAG}" -m "release: ${NEW_TAG}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "${NEW_TAG}"
